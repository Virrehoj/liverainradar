<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Live regnradar och väderprognos för Sverige.">
  <title>Nederbörd — live regnradar</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div id="map" aria-label="Radarkarta"></div>

  <!-- Brand + search -->
  <header class="hud hud-top">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Nederbörd</span>
    </div>
    <div class="search" role="search">
      <input id="search-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Sök en plats…" aria-label="Sök en plats">
      <ul id="search-results" class="search-results" hidden></ul>
    </div>
    <button id="locate-btn" class="icon-btn" aria-label="Använd min plats" title="Använd min plats">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <circle cx="8" cy="8" r="2.4" fill="currentColor"/>
        <path d="M8 0v2.6M8 13.4V16M0 8h2.6M13.4 8H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="theme-btn" class="icon-btn" aria-label="Växla mörkt/ljust läge" title="Växla mörkt/ljust läge">
      <svg class="icon-sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <circle cx="8" cy="8" r="3.2" fill="currentColor"/>
        <path d="M8 0.5v2M8 13.5v2M15.5 8h-2M2.5 8h-2M13.4 2.6l-1.4 1.4M4 12l-1.4 1.4M13.4 13.4L12 12M4 4 2.6 2.6"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M13.8 9.8A6 6 0 1 1 6.2 2.2a6.6 6.6 0 1 0 7.6 7.6z" fill="currentColor"/>
      </svg>
    </button>
  </header>

  <!-- Recent searches -->
  <div class="hud hud-recent" id="recent" hidden></div>

  <!-- Radar timeline -->
  <div class="hud hud-timeline" id="timeline" hidden>
    <button id="play-btn" class="play-btn" aria-label="Spela upp animering">
      <svg class="icon-play" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M4 2.5v11l9-5.5z" fill="currentColor"/>
      </svg>
      <svg class="icon-pause" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/>
      </svg>
    </button>
    <div class="timeline-body">
      <div class="ticks" id="ticks" role="presentation"></div>
      <input id="scrubber" type="range" min="0" max="0" value="0" step="1"
             aria-label="Radarbildens tidpunkt">
    </div>
    <div class="time-readout">
      <span id="frame-badge" class="frame-badge" hidden>PROGNOS</span>
      <span id="frame-time">--:--</span>
      <span id="frame-date" class="frame-date"></span>
    </div>
  </div>

  <div class="hud hud-status" id="status">Laddar radar…</div>

  <!-- Rain intensity legend -->
  <div class="hud hud-legend" aria-hidden="true">
    <span>lätt</span>
    <span class="legend-bar"></span>
    <span>kraftigt</span>
  </div>

  <!-- Forecast panel -->
  <aside class="panel" id="panel" hidden>
    <button class="panel-close" id="panel-close" aria-label="Stäng prognos">×</button>
    <h2 id="panel-place">—</h2>
    <div class="now">
      <span class="now-symbol" id="now-symbol"></span>
      <div class="now-main">
        <span class="now-temp" id="now-temp">–°</span>
        <span class="now-feels" id="now-feels"></span>
      </div>
      <div class="now-meta">
        <span id="now-desc"></span>
        <span id="now-wind"></span>
      </div>
    </div>
    <div class="now-stats" id="now-stats"></div>
    <div class="sun-row" id="sun-row" hidden></div>
    <h3>Kommande timmar</h3>
    <ol class="hours" id="hours"></ol>
    <h3>Kommande dagar</h3>
    <ol class="days" id="days"></ol>
    <p class="panel-note">Prognos: SMHI:s punktprognos (SNOW1g). Nederbördsstaplar visar mm/h;
      dygnssummor i mm med lokala regntimmar (≈ där SMHI:s tidssteg är grövre än en timme).</p>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
